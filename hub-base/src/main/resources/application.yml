spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/hub}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:<<YOUR_PASSWORD>>}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  mail:
    host: ${SMTP_HOST:smtp.google.com}
    username: ${SMTP_USERNAME:cykor}
    password: ${SMTP_PASSWORD:<<YOUR_PASSWORD>>}
    port: 587
    properties.mail.smtp:
      auth: true
      starttls:
        enable: true
        required: true
      connectiontimeout: 15000
      timeout: 45000
error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    http-statuses:
      org.springframework.security.authorization.AuthorizationDeniedException: unauthorized
    codes:
      UserEmailUnique: USER_EMAIL_UNIQUE
      UserExternalLoginUnique: USER_EXTERNAL_LOGIN_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
springdoc:
  pathsToMatch: /api/**, /authenticate, /register
app:
  baseHost: ${BASE_HOST:http://localhost:3000}
  mail:
    from: no-reply@cykor.com
    displayName: CY-KOR Corp
  google:
    client-id: ${GOOGLE_CLIENT_ID:<<YOUR_GOOGLE_CLIENT>>}
    client-secret: ${GOOGLE_CLIENT_SECRET:<<YOUR_GOOGLE_SECRET>>}
  facebook:
    client-id: ${FACEBOOK_CLIENT_ID:<<YOUR_FACEBOOK_CLIENT>>}
    client-secret: ${FACEBOOK_CLIENT_SECRET:<<YOUR_FACEBOOK_SECRET>>}
jwt:
  secret: 0666438A7846FAC78F805F3E1C85F5EB
